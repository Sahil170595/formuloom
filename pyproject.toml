[project]
name = "formuloom"
version = "0.1.0"
description = "Workbook change classification with structural routing, consensus, adjudication and weak supervision."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.12", "pydantic>=2.7", "pydantic-settings>=2.3", "openpyxl>=3.1.5", "openai>=2.44.0", "tenacity>=9.1.4"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "black>=24.8", "mypy>=1.11", "pytest>=8.3"]

[project.scripts]
formuloom = "formuloom.cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["formuloom"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["formuloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
